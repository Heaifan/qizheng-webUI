<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>奇正相生 v0.5.0 地貌笔刷重构版</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <main id="app" class="app">
    <header class="topbar">
      <div>
        <strong>奇正相生</strong>
        <span>v0.5.0 地貌笔刷重构版</span>
      </div>
      <button id="randomBtn" class="primary">随机地图</button>
    </header>

    <section class="canvasWrap">
      <canvas id="mapCanvas" aria-label="战术地图编辑画布"></canvas>
      <div id="loading" class="loading">初始化中...</div>
    </section>

    <section class="panel">
      <div class="row">
        <label>地形：</label>
        <button data-terrain="grass">草地</button>
        <button data-terrain="high">高地</button>
        <button data-terrain="water">水面</button>
        <button data-terrain="forest">树林</button>
      </div>
      <div class="row">
        <label>地貌：</label>
        <button id="landformModeBtn">地表模式</button>
        <button data-landform="mountain" class="lf hide">山地</button>
        <button data-landform="basin" class="lf hide">盆地</button>
        <button data-landform="plateau" class="lf hide">高原</button>
        <button data-landform="valley" class="lf hide">山谷</button>
        <button data-landform="smooth" class="lf hide">平滑</button>
      </div>
      <div class="row">
        <label>操作：</label>
        <button id="modeBtn">模式：画笔</button>
        <button id="brushDown">画笔-</button>
        <button id="brushUp">画笔+</button>
        <button id="clearBtn">清空</button>
        <button id="contourBtn">等高线：关</button>
      </div>
    </section>

    <footer id="statusBar" class="status">竖屏 | 模式:画笔 | 地形:草地 | 笔:4格 | FPS:0</footer>
  </main>
  <script src="./js/qzNamespace.js"></script>
  <script src="./js/map/data/mapConstants.js"></script>
  <script src="./js/map/data/mapLayers.js"></script>
  <script src="./js/map/data/mapAccess.js"></script>
  <script src="./js/map/data/heightEdit.js"></script>
  <script src="./js/map/data/mapClear.js"></script>
  <script src="./js/prng.js"></script>
  <script src="./js/map/render/drawLayers.js"></script>
  <script src="./js/map/render/drawOverlay.js"></script>
  <script src="./js/map/render/drawContours.js"></script>
  <script src="./js/map/render/drawRelief.js"></script>
  <script src="./js/map/mapDraw.js"></script>
  <script src="./js/map/landform/landformCore.js"></script>
  <script src="./js/map/landform/landformBrushes.js"></script>
  <script src="./js/map/landform/deriveTerrain.js"></script>
  <script src="./js/map/mapBrush.js"></script>
  <script src="./js/ui/uiState.js"></script>
  <script src="./js/ui/uiControls.js"></script>
  <script src="./js/map/forest/forestPatch.js"></script>
  <script src="./js/map/water/riverPath.js"></script>
  <script src="./js/map/mapRandom.js"></script>
  <script src="./js/debug.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
